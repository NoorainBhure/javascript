<!-- three numbers -->
 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script>
        var a=parseInt(prompt("Enter the first Number"));
        var b=parseInt(prompt("Enter the Second Number"));
        var c=parseInt(prompt("Enter the Third Number"));
     (a>b && a>c)?document.write("A is Greater"):
     (b>a && b>c)?document.write("B is Greater"):
     (c>a && c>b)?document.write("C is Greater"):
     (a==b && b==c)?document.write("All numbers are equal"):
     document.write("Wrong input");
    </script>
</head>
<body>
    
</body>
</html>
