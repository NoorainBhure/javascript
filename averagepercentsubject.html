<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <script>
        var subject1= parseInt( prompt("Enter the first  subject marks"));
        var subject2= parseInt( prompt("Enter the second  subject marks"));
        var subject3= parseInt( prompt("Enter the third  subject marks"));
        var subject4= parseInt( prompt("Enter the fourth  subject marks"));
        var subject5= parseInt( prompt("Enter the five subject marks"));
        var result=subject1+subject2+subject3+subject4+subject5;
        var average=result/5;
        var percent=(result/500)*100;
        document.write("The sum of the five subject is: "+result+"<br>");
        document.write("The average of subject is: "+average+"<br>");
        document.write("The percentage is: "+percent+"%"+"<br>");
        
    </script>
</head>

</body>
</html>
