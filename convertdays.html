<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var a=parseInt(prompt("Enter the specific days "));
        var year=Math.floor(a/365);
        a=a%365;
        var month=Math.floor(a/30);
        a=a%30;
        document.write("Years ="+year+"<br>");
        document.write("Months ="+month+"<br>");
        document.write(" Remaining Days ="+a+"<br>");
    </script>
</head>
<body>
    
</body>
</html>
