<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button  onclick="displayDate()">Show Date and Time</button>
    <p id="result"></p>
    <script>
        function displayDate(){
            let now=new Date();
            document.getElementById("result").innerHTML=now;
        }
    </script>
</body>
</html>
