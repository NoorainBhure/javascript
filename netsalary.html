<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var salary=parseInt(prompt("Enter the salary amount"));
        var TA=(salary*2)/100;
        var DA=(salary*2)/100;
        var HRA=(salary*2)/100;
        var netSalary=TA+DA+HRA;
        document.write("The TA of Salary :"+TA+"<br>");
        document.write("The DA of Salary :"+DA+"<br>");
        document.write("The HRA of Salary :"+HRA+"<br>");
        document.write("The Net Salary :"+netSalary+"<br>");
    </script>
</head>
<body>
    
</body>
</html>
